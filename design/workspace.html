function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tr(pair){return state.lang==='yue'?esc(pair[1]):state.lang==='both'?esc(pair[0])+'<small>'+esc(pair[1])+'</small>':esc(pair[0]);}
function t(k){return tr(words[k]||[k,k]);}function button(label,intent,primary=false){return `<button data-component="md.button.${primary?'filled':'outlined'}" ${primary?'class="primary"':''} data-intent="${esc(intent)}">${label}</button>`;}
function search(id,label){return `<div class="search" data-component="md.textfield.outlined" data-search-scope="${id}"><input aria-label="${esc(label)}" placeholder="${esc(label)}" data-search="${id}"><button data-builder="${id}" aria-label="Regex builder for ${esc(label)}">.*</button></div>`;}

e destination identity using the native SSH service.')}${button(t('install'),'Open the exact target/key review, then run the real installation with progress and cancellation.',true)}</div></section></div>`;}

nd effective status.','Narration options'],['Schedules','Dates, weekdays, timezone and external sources.','Schedule options'],['Locks','Per-element policies, durations and recovery.','Manage locks'],['Advanced','Validated service settings and default provenance.','Advanced options']]},help:{title:['Help and documentation','說明與文件'],desc:['Read offline guidance beside the work you are doing.','工作時隨時閱讀離線說明。'],actions:['About','Changelog','Support Tickets'],rows:[['Install a public key','Connection setup, host identity and recovery.','Read article'],['Understand the result','Cancellation, partial outcomes and safe retry.','Read article'],['Customize the workspace','Tabs, appearance, search and keyboard access.','Read article']]}};
function generic(){const s=specs[state.screen]||specs.tools;return `<section class="surface" data-component="md.surface">${state.screen==='settings'?tabs([['General','一般'],['Appearance','外觀'],['Language','語言'],['Accessibility','無障礙'],['Advanced','進階']]):''}${search(state.screen+'.body',state.lang==='yue'?'搜尋此頁':'Search '+s.title[0].toLowerCase())}<div class="stack">${s.rows.map(r=>`<article class="setting" data-component="md.listitem" data-filter-row data-target="${state.screen}.${r[0].replace(/[^a-z]/gi,'').toLowerCase()}"><div><h3>${esc(r[0])}</h3><small>${esc(r[1])}</small></div>${button(esc(r[2]),'Open the native '+r[0]+' workflow, with local search, contextual help and target-scoped controls.')}</article>`).join('')}</div></section>`;}
function draw(){document.documentElement.dataset.theme=state.theme;document.documentElement.lang=state.lang==='yue'?'zh-HK':'en';document.getElementById('theme').textContent=state.theme==='light'?'Dark theme':'Light theme';document.getElementById('nav-search').innerHTML=search('tabs.current','Find a tab');document.getElementById('nav').innerHTML=Object.entries(names).map(([id,pair])=>`<button role="tab" data-screen="${id}" aria-selected="${state.screen===id}" aria-controls="content" tabindex="${state.screen===id?'0':'-1'}" title="${esc(pair[0])}" data-target="tabs.${id}"><span class="glyph" aria-hidden="true">${pair[2]}</span><span class="nav-label">${tr(pair)}</span></button>`).join('');const s=specs[state.screen];let banner='';if(state.phase!=='ready'&&state.phase!=='empty'){const copy={review:['Review installation','Confirm the account, host and port, public-key fingerprint and exact operation before continuing.'], 'unknown-host':['Host identity needs approval','example.test:22 · Algorithm and full fingerprint await real inspection. Compare with an independent trusted source; approval must persist before continuing.'], 'changed-host':['Host identity changed: installation stopped','example.test:22 · Show previous and observed algorithm/fingerprint from the real trust store. Do not replace approval or retry until investigated.'], cancelling:['Cancellation requested','Waiting for the operation owner to settle. Completed SSH changes remain installed.'], cancelled:['Operation cancelled','Terminal service confirmation is required. Preserve completed changes; reconcile any uncertain target before retry.'], partial:['Some targets did not complete','Show exact per-target counts and outcomes. Retry only eligible failed targets; preserve completed changes.'], success:['All selected targets confirmed','Reference only: production requires terminal verification for every target, with installed/already-present distinctions.'],working:['Operation in progress','This is a reference state. Production shows the real phase and cancellation outcome.'],error:['Connection could not be completed','Production displays the actual cause and preserves the entered values.'],locked:['This element is locked','Unlock this exact target to continue. This is a convenience lock, not data protection.']}[state.phase];banner=`<div class="state-banner ${['error','changed-host'].includes(state.phase)?'error':''}"><strong>${copy[0]}</strong><small>${copy[1]}</small>${button(({working:'Cancel',locked:'Unlock…',review:'Review exact target', 'unknown-host':'Review identity', 'changed-host':'Investigate identity',cancelling:'View progress',cancelled:'Inspect retained changes',partial:'Review failed targets',success:'Export result'})[state.phase]||'Retry','Open the corresponding native state handler; this reference changes no real state.')}</div>`;}document.getElementById('content').innerHTML=`<div class="heading"><div><h1>${tr(names[state.screen]||names.connections)}</h1><p class="sub">${state.screen==='connections'?tr(['Install a public key on an SSH destination.','將公開金鑰安裝至 SSH 目標。']):tr(s.desc)}</p></div><div class="actions">${state.screen==='connections'?`<button class="compact-back" id="list-toggle">${t('back')}</button>${button(t('add'),'Create a blank connection with the shipped port default.',true)}`:s.actions.map(a=>button(esc(a),'Open '+a+' with its own local search and adjacent regex builder.')).join('')}</div></div>${banner}${state.phase==='empty'?`<section class="surface empty"><h2>${t('empty')}</h2><p>${state.screen==='connections'?t('hint'):tr(['Your records will appear here after your first action.','完成第一項操作後，記錄就會在這裡顯示。'])}</p>${button(state.screen==='connections'?t('add'):'Start a new record','Open the native guided creation workflow.',true)}</section>`:state.screen==='connections'?connection():generic()}`;document.querySelectorAll('button,input').forEach((el,i)=>{el.dataset.target??='reference.'+state.screen+'.control.'+i;el.dataset.component??=el.tagName==='INPUT'?'md.textfield.outlined':'md.button.outlined';});}
let anchor=null;function panel(title,body,origin){anchor=origin;const box=document.createElement('section');box.className='overlay';box.setAttribute('role','dialog');box.setAttribute('aria-label',title);box.dataset.component='md.panel';box.innerHTML=`<div class="overlay-head"><h2>${esc(title)}</h2><button data-close aria-label="Close panel">×</button></div>${body}`;document.getElementById('overlays').replaceChildren(box);const r=origin.getBoundingClientRect(),w=Math.min(520,innerWidth-24);box.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';box.style.top=(r.bottom+box.offsetHeight+12<=innerHeight?r.bottom+8:Math.max(12,r.top-box.offsetHeight-8))+'px';box.querySelector('input,button').focus();}
function closePanel(){document.getElementById('overlays').replaceChildren();anchor?.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){closePanel();state.screen=b.dataset.screen;draw();return;}if(b.dataset.lang){state.lang=b.dataset.lang;draw();return;}if(b.dataset.state){state.phase=b.dataset.state;draw();return;}if(b.id==='open-navigation'){panel('Workspace tabs',search('tabs.compact-drawer','Find a workspace tab')+Object.entries(names).map(([id,p])=>`<button class="row" data-filter-row data-screen="${id}">${tr(p)}</button>`).join('')+button('Accessibility','Open accessibility tools without leaving this workspace.'),b);return;}if(b.id==='theme'){state.theme=state.theme==='light'?'dark':'light';draw();return;}if(b.id==='list-toggle'){document.getElementById('connection-split').classList.toggle('show-list');return;}if(b.dataset.record){document.querySelectorAll('[data-record]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('record-title').textContent=b.querySelector('strong').textContent;document.getElementById('connection-split').classList.remove('show-list');notify('Reference selection changed. Production binds every field to the selected record.');return;}if(b.hasAttribute('data-close')){closePanel();return;}if(b.dataset.builder){const scope=b.dataset.builder;panel('Regex workbench · '+scope,`<p class="sub">Attached to this field only. Reference structure; native engine evaluation is not implemented here.</p>${tabs([['Construct','構建'],['Explain','解說'],['Matches','符合'],['Replace','取代'],['Tests','測試'],['Profile','分析']])}<label class="field"><span>Pattern</span><input value="" aria-label="Pattern for ${esc(scope)}"></label><div class="note">Engine/version, dialect, flags and unsupported constructs must come from the actual native engine.</div><div class="stack"><p>Guided tokens · Unicode · groups · assertions · quantifiers · replacement templates</p><p>Parse tree · capture table · zero-width navigation · test suites · snippets</p><p>Bounded timing · risk diagnostics · trace availability · cancellation</p></div>${button('Return to search','Return the validated native pattern, flags and mode to this exact search scope.')}`,b);return;}if(b.id==='palette'){panel('Find a command',search('palette','Search commands and settings')+Object.entries(names).map(([id,p])=>`<button class="row" data-screen="${id}">${tr(p)}</button>`).join(''),b);return;}if(b.dataset.section){b.parentElement.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));notify('Reference section: '+b.dataset.section+'. See the implementation handoff for its full native control inventory.');return;}if(b.dataset.intent)notify('Design intent: '+b.dataset.intent);});
document.addEventListener('input',e=>{if(!e.target.dataset.search)return;const root=e.target.closest('.surface')||e.target.closest('aside')||e.target.closest('.overlay');const query=e.target.value.toLocaleLowerCase();root?.querySelectorAll('[data-filter-row]').forEach(row=>row.hidden=!row.textContent.toLocaleLowerCase().includes(query));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();document.getElementById('message').hidden=true;}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='f'){e.preventDefault();document.getElementById('palette').click();}if(e.target.closest('#nav')&&['ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();const items=[...document.querySelectorAll('#nav button')],i=items.indexOf(e.target);items[e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}if(e.shiftKey&&e.key==='F10'){e.preventDefault();context(e.target);}});
function context(el){const target=el.closest('[data-target]')||el;panel('Element actions',`<p class="sub">Target: ${esc(target.dataset.target||target.tagName.toLowerCase())}</p>${search('context.'+(target.dataset.target||'surface'),'Filter actions')}${button('Edit appearance…','Open the exact target context in the complete native element editor.')}${button('Lock this element…','Open the independent credential policy wizard for this exact element.')}`,target);}
document.addEventListener('contextmenu',e=>{e.preventDefault();context(e.target);});if(!names[state.screen])state.screen='connections';draw();
