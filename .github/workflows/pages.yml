name: Documentation Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'scripts/build-site.*', 'build/manifest.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate complete documentation
        shell: cmd
        run: build.bat --site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Retain safe documentation output
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: documentation-output-${{ github.run_id }}
          path: artifacts/site
          if-no-files-found: warn
          retention-days: 7
