name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WinSshCopyId.sln -p:Platform=x64

      - name: Build (Release, x64)
        run: dotnet build WinSshCopyId.sln -c Release -p:Platform=x64 --no-restore
